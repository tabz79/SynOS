  <rect x="0" y="12" width="150" height="2" fill="#4f46e5"/>
  <rect x="150" y="12" width="10" height="6" fill="#6366f1" opacity="0.8"/>
  
  <!-- Small side medical-themed accent grid line -->
  <line x1="8" y1="35" x2="8" y2="265" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="8" y1="35" x2="12" y2="35" stroke="#e2e8f0" stroke-width="0.3"/>
  <line x1="8" y1="265" x2="12" y2="265" stroke="#e2e8f0" stroke-width="0.3"/>
  
  <!-- Subtle pulse wave motif on the left margin -->
  <path d="M 8 130 L 8 140 L 9.5 140 L 10.5 137 L 11.5 145 L 12.5 135 L 13.5 141 L 14.5 140 L 20 140" fill="none" stroke="#6366f1" stroke-width="0.3" opacity="0.35"/>
  
