  <g transform="translate(105, 148.5) scale(0.6)" opacity="0.04" fill="none" stroke="#1e1b4b" stroke-width="4">
    <path d="M -50 0 L 50 0 M 0 -50 L 0 50" stroke-width="8" stroke-linecap="round"/>
