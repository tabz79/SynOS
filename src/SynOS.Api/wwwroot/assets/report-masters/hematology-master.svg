  </g>

  <!-- Elegant Footer Graphics -->
  <rect x="15" y="275" width="180" height="0.5" fill="#e2e8f0"/>
  <rect x="15" y="277" width="5" height="5" fill="#4f46e5" rx="1"/>
  <rect x="23" y="277" width="5" height="5" fill="#6366f1" rx="1" opacity="0.7"/>
  <rect x="31" y="277" width="5" height="5" fill="#312e81" rx="1" opacity="0.4"/>
  <text x="195" y="281" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#64748b" text-anchor="end">SYNOS HEALTHCARE LABS</text>
