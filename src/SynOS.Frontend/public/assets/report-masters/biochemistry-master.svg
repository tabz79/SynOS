<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <!-- Professional Master Background - Biochemistry Modality -->
  
  <!-- Sleek decorative header design -->
  <path d="M 0 0 L 210 0 L 210 14 L 170 14 L 160 8 L 0 8 Z" fill="#064e3b" opacity="0.95"/>
  <rect x="0" y="8" width="160" height="2" fill="#10b981"/>
  <rect x="160" y="8" width="10" height="6" fill="#34d399" opacity="0.8"/>
  
  <!-- Left margin grid-lines -->
  <line x1="10" y1="30" x2="10" y2="270" stroke="#e2e8f0" stroke-width="0.3"/>
  <circle cx="10" cy="30" r="1" fill="#10b981"/>
  <circle cx="10" cy="270" r="1" fill="#064e3b"/>

  <!-- Molecular Structure motif on the right margin -->
  <g transform="translate(195, 140)" fill="none" stroke="#10b981" stroke-width="0.3" opacity="0.4">
    <!-- Hexagon ring 1 -->
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6"/>
    <!-- Connection lines -->
    <line x1="0" y1="12" x2="0" y2="24"/>
    <!-- Hexagon ring 2 -->
    <polygon points="0,24 10.4,30 10.4,42 0,48 -10.4,42 -10.4,30" opacity="0.5"/>
  </g>
  
  <!-- Watermark in center - Chemical Flask / Molecular Ring -->
  <g transform="translate(105, 148.5) scale(0.65)" opacity="0.03" fill="none" stroke="#064e3b" stroke-width="4">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" stroke-width="5"/>
    <circle cx="0" cy="0" r="20"/>
    <path d="M -15 -25 L -5 -45 L 5 -45 L 15 -25 Z" stroke-width="4"/>
    <line x1="-12" y1="-10" x2="12" y2="-10"/>
    <line x1="-15" y1="5" x2="15" y2="5"/>
  </g>

  <!-- Elegant Footer Graphics -->
  <rect x="15" y="275" width="180" height="0.5" fill="#e2e8f0"/>
  <rect x="15" y="277" width="5" height="5" fill="#10b981" rx="1"/>
  <rect x="23" y="277" width="5" height="5" fill="#34d399" rx="1" opacity="0.7"/>
  <rect x="31" y="277" width="5" height="5" fill="#064e3b" rx="1" opacity="0.4"/>
  <text x="195" y="281" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#64748b" text-anchor="end">SYNOS PATHOLOGY LABORATORY</text>
</svg>
