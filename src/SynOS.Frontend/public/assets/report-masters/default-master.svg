<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <!-- Professional Master Background - Default Modality -->
  
  <!-- Sleek corporate top decorative design -->
  <path d="M 0 0 L 210 0 L 210 12 L 175 12 L 165 7 L 0 7 Z" fill="#0f172a" opacity="0.95"/>
  <rect x="0" y="7" width="165" height="2" fill="#3b82f6"/>
  <rect x="165" y="7" width="10" height="5" fill="#60a5fa" opacity="0.8"/>
  
  <!-- Double side border rules -->
  <line x1="10" y1="30" x2="10" y2="270" stroke="#e2e8f0" stroke-width="0.3"/>
  <circle cx="10" cy="30" r="1" fill="#3b82f6"/>
  <circle cx="10" cy="270" r="1" fill="#0f172a"/>

  <!-- Watermark in center - Elegant SynOS Branding Seal -->
  <g transform="translate(105, 148.5) scale(0.65)" opacity="0.03" fill="none" stroke="#0f172a" stroke-width="3">
    <!-- Outer concentric rings -->
    <circle cx="0" cy="0" r="45"/>
    <circle cx="0" cy="0" r="41" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Stylized S shape inside -->
    <path d="M -15 -18 C -15 -25, 15 -25, 15 -12 C 15 0, -15 0, -15 12 C -15 25, 15 25, 15 18" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Elegant Footer Graphics -->
  <rect x="15" y="275" width="180" height="0.5" fill="#e2e8f0"/>
  <rect x="15" y="277" width="5" height="5" fill="#0f172a" rx="1"/>
  <rect x="23" y="277" width="5" height="5" fill="#3b82f6" rx="1" opacity="0.7"/>
  <rect x="31" y="277" width="5" height="5" fill="#60a5fa" rx="1" opacity="0.4"/>
  <text x="195" y="281" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#64748b" text-anchor="end">SYNOS DIAGNOSTIC LABORATORIES</text>
</svg>
